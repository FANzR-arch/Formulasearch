<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulasearch - Focus Grid Reference</title>
    <style>
      :root {
        color-scheme: dark;
        --page: #050505;
        --ink: #f4f4ef;
        --muted: #9b9b94;
        --line: rgba(244, 244, 239, 0.22);
        --gutter: clamp(18px, 3vw, 52px);
        --display: clamp(54px, 11vw, 180px);
        --meta: clamp(11px, 0.8vw, 14px);
      }

      * {
        box-sizing: border-box;
      }

      html {
        background: var(--page);
      }

      body {
        margin: 0;
        background: var(--page);
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      a {
        color: inherit;
      }

      .page {
        width: 100%;
        padding: 20px var(--gutter) 80px;
      }

      .rail,
      .intro,
      .card-meta {
        display: flex;
        justify-content: space-between;
        gap: 24px;
      }

      .rail {
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: var(--meta);
        letter-spacing: 0.03em;
        text-transform: uppercase;
      }

      h1 {
        margin: 42px 0 28px;
        font-size: var(--display);
        font-weight: 560;
        letter-spacing: -0.07em;
        line-height: 0.8;
      }

      .intro {
        align-items: flex-end;
        padding: 20px 0 64px;
        border-bottom: 1px solid var(--line);
      }

      .intro p {
        max-width: 620px;
        margin: 0;
        font-size: clamp(20px, 2.6vw, 44px);
        line-height: 1.06;
        letter-spacing: -0.035em;
      }

      .intro nav {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 8px 18px;
        font-size: var(--meta);
      }

      .intro nav a {
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }

      .work-grid {
        display: grid;
        grid-template-columns: repeat(12, minmax(0, 1fr));
        gap: clamp(34px, 5vw, 90px) clamp(18px, 2.4vw, 42px);
        padding-top: 72px;
      }

      .work-card {
        grid-column: span 6;
        min-width: 0;
        color: var(--ink);
        text-decoration: none;
        transition: opacity 180ms ease-out;
      }

      .work-card--hero {
        grid-column: 1 / span 7;
      }

      .work-card--small {
        grid-column: 8 / span 5;
        align-self: start;
      }

      .work-card--small-left {
        grid-column: 1 / span 5;
      }

      .work-card--wide {
        grid-column: 6 / span 7;
      }

      .media {
        position: relative;
        min-height: 260px;
        overflow: hidden;
        background: #161616;
        isolation: isolate;
      }

      .work-card--hero .media {
        aspect-ratio: 4 / 5;
      }

      .work-card--small .media,
      .work-card--small-left .media {
        aspect-ratio: 16 / 11;
      }

      .work-card--wide .media {
        aspect-ratio: 16 / 9;
      }

      .media::before {
        content: "";
        position: absolute;
        inset: -5%;
        background: var(--art);
        transform: scale(1);
        transition: transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1),
          filter 240ms ease-out;
      }

      .art-a {
        --art: radial-gradient(circle at 28% 42%, #f2a7ff 0 12%, transparent 35%),
          radial-gradient(circle at 70% 55%, #6548ff 0 18%, transparent 42%),
          linear-gradient(125deg, #14082a, #331a77 48%, #fd57c9);
      }

      .art-b {
        --art: radial-gradient(circle at 68% 35%, #f2ffb0 0 8%, transparent 24%),
          radial-gradient(circle at 40% 60%, #1af4c6, transparent 38%),
          linear-gradient(145deg, #081f23, #2037b8 55%, #d66cff);
      }

      .art-c {
        --art: repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.08) 0 1px,
            transparent 1px 22px
          ),
          linear-gradient(145deg, #f0e8d8, #8b8a85 50%, #222);
      }

      .art-d {
        --art: radial-gradient(circle at 26% 48%, #ff5c35, transparent 22%),
          radial-gradient(circle at 66% 45%, #ffd554, transparent 18%),
          linear-gradient(110deg, #35150d, #962135 52%, #3c1d74);
      }

      .view-line {
        position: absolute;
        left: 12%;
        right: 12%;
        top: 50%;
        z-index: 1;
        height: 1px;
        background: rgba(244, 244, 239, 0.82);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }

      .view-label {
        position: absolute;
        left: 50%;
        top: 50%;
        z-index: 2;
        padding: 5px 9px;
        background: var(--ink);
        color: var(--page);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        opacity: 0;
        transform: translate(-50%, -50%);
        transition: opacity 140ms ease-out 40ms;
      }

      .card-meta {
        padding-top: 10px;
        font-size: var(--meta);
      }

      .card-meta span:nth-child(2) {
        color: var(--muted);
      }

      @media (hover: hover) and (pointer: fine) {
        .work-grid:has(.work-card:hover) .work-card:not(:hover),
        .work-grid:has(.work-card:focus-visible) .work-card:not(:focus-visible) {
          opacity: 0.28;
        }

        .work-card:hover .media::before,
        .work-card:focus-visible .media::before {
          transform: scale(1.025);
          filter: saturate(1.08);
        }

        .work-card:hover .view-line,
        .work-card:focus-visible .view-line {
          transform: scaleX(1);
        }

        .work-card:hover .view-label,
        .work-card:focus-visible .view-label {
          opacity: 1;
        }
      }

      .work-card:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 6px;
      }

      @media (max-width: 760px) {
        .rail span:nth-child(2),
        .rail span:nth-child(3) {
          display: none;
        }

        h1 {
          margin-top: 34px;
          letter-spacing: -0.055em;
        }

        .intro {
          display: block;
          padding-bottom: 40px;
        }

        .intro nav {
          justify-content: flex-start;
          margin-top: 28px;
        }

        .work-grid {
          display: block;
          padding-top: 48px;
        }

        .work-card {
          display: block;
          margin-bottom: 48px;
        }

        .work-card .media {
          aspect-ratio: 4 / 3;
        }

        .view-line,
        .view-label {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <div class="rail">
          <span>Selected assets</span>
          <span>Formulasearch</span>
          <span>Visual / AI / Tools</span>
        </div>
        <h1>FORMULA<br />SEARCH</h1>
        <div class="intro">
          <p>把审美、AI、内容与工具整理成可以直接拿走的资产。</p>
          <nav aria-label="主要入口">
            <a href="#shelf">货架</a>
            <a href="#writing">写作</a>
            <a href="#work">作品</a>
            <a href="#business">业务</a>
            <a href="#about">关于</a>
          </nav>
        </div>
      </header>

      <section class="work-grid" aria-label="精选内容">
        <a class="work-card work-card--hero" href="#visual-skill">
          <div class="media art-a">
            <span class="view-line" aria-hidden="true"></span>
            <span class="view-label" aria-hidden="true">VIEW</span>
          </div>
          <div class="card-meta">
            <strong>视觉身份扩展器</strong>
            <span>Visual Skill</span>
            <span>01</span>
          </div>
        </a>

        <a class="work-card work-card--small" href="#tool">
          <div class="media art-b">
            <span class="view-line" aria-hidden="true"></span>
            <span class="view-label" aria-hidden="true">VIEW</span>
          </div>
          <div class="card-meta">
            <strong>AI 工作流工具</strong>
            <span>Tool</span>
            <span>02</span>
          </div>
        </a>

        <a class="work-card work-card--small-left" href="#architecture">
          <div class="media art-c">
            <span class="view-line" aria-hidden="true"></span>
            <span class="view-label" aria-hidden="true">VIEW</span>
          </div>
          <div class="card-meta">
            <strong>建筑项目档案</strong>
            <span>Architecture</span>
            <span>03</span>
          </div>
        </a>

        <a class="work-card work-card--wide" href="#business">
          <div class="media art-d">
            <span class="view-line" aria-hidden="true"></span>
            <span class="view-label" aria-hidden="true">VIEW</span>
          </div>
          <div class="card-meta">
            <strong>网站与 SEO 实践</strong>
            <span>Business / Case</span>
            <span>04</span>
          </div>
        </a>
      </section>
    </main>
  </body>
</html>
